# Tests a pushed vX.Y.Z tag on Linux, macOS and Windows, publishes it to GitHub Releases, Homebrew, winget and npm,
# then installs the published release on each system and tries it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing is built or published unless the tests pass on every system sortdo supports.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The newest Go release, so every build has the latest security fixes in Go's own packages.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Release notes from CHANGELOG.md
        run: go run ./tools/changelog notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      # GoReleaser signs but silently skips notarization when a notary secret is empty, so check all five first.
      - name: Check the Apple signing secrets
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is missing from the release environment"; exit 1; fi
          done
      - name: Build and publish (GitHub Releases, Homebrew, winget)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew and winget commits are authored by the person who pushed the tag.
          RELEASE_AUTHOR_NAME: ${{ vars.RELEASE_AUTHOR_NAME || github.actor }}
          RELEASE_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          # The minisign release key that signs checksums.txt (tools/sign). sortdo update refuses an unsigned release.
          SORTDO_SIGNING_KEY: ${{ secrets.SORTDO_SIGNING_KEY }}
          SORTDO_SIGNING_PASSWORD: ${{ secrets.SORTDO_SIGNING_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Sort's Developer ID certificate and App Store Connect key (base64), to sign and notarize the macOS programs.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Attest where the downloads were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.minisig
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      # npm trusted publishing (OIDC, no token) needs npm 11.5.1 or later; it adds provenance on its own.
      - run: npm install -g npm@latest
      - name: Publish to npm
        run: |
          node npm/build.mjs dist "${GITHUB_REF_NAME#v}" npm-out
          # A leading ./ makes npm read a folder; "npm-out/sortdo" alone is read as a GitHub repository.
          for folder in ./npm-out/cli-*; do npm publish "$folder"; done
          npm publish ./npm-out/sortdo

  # Installs the release the way people do, on each system, and tries it without signing in.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      SORTDO_INSTALL_SKILL: '1'
    steps:
      - name: Install script, then the commands, update and uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          want="sortdo ${GITHUB_REF_NAME#v}"
          curl -fsSL https://sort.do/install | bash
          export PATH="$HOME/.local/bin:$PATH"
          test "$(sortdo --version)" = "$want"
          sortdo help > /dev/null
          sortdo status
          sortdo update | grep -q "is the latest version"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --strict "$HOME/.local/bin/sortdo"
            codesign -dv "$HOME/.local/bin/sortdo" 2>&1 | grep -qx "Authority=Developer ID Application: Sort Works Ltd (KDLWZ98LA3)"
          fi
          if out=$(sortdo teams list 2>&1); then echo "teams list worked without a sign-in"; exit 1; fi
          echo "$out" | grep -q "Sign in"
          test -f "$HOME/.agents/skills/sortdo/SKILL.md"
          sortdo uninstall --yes
          test ! -e "$HOME/.local/bin/sortdo"
          test ! -e "$HOME/.agents/skills/sortdo"
      - name: Install script, then the commands, update and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $want = "sortdo $($env:GITHUB_REF_NAME.TrimStart('v'))"
          irm https://sort.do/install.ps1 | iex
          $program = Join-Path $env:LOCALAPPDATA 'Programs\sortdo\sortdo.exe'
          $got = sortdo --version
          if ($got -ne $want) { throw "version: $got" }
          sortdo help | Out-Null
          if ($LASTEXITCODE) { throw 'help failed' }
          sortdo status
          if ($LASTEXITCODE) { throw 'status failed' }
          $update = sortdo update
          if ("$update" -notmatch 'is the latest version') { throw "update: $update" }
          $teams = sortdo teams list 2>&1
          if ($LASTEXITCODE -eq 0 -or "$teams" -notmatch 'Sign in') { throw "teams list: $teams" }
          if (-not (Test-Path "$HOME\.agents\skills\sortdo\SKILL.md")) { throw 'the skill was not installed' }
          sortdo uninstall --yes
          if ($LASTEXITCODE) { throw 'uninstall failed' }
          # Windows cannot delete a running program: uninstall moves it aside and deletes it just after it exits.
          Start-Sleep -Seconds 6
          if ((Test-Path $program) -or (Test-Path "$program.old")) { throw 'the program is still there' }
          if (Test-Path "$HOME\.agents\skills\sortdo") { throw 'the skill is still there' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: npm
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          platform=$(node -p "'@sortdo/cli-' + process.platform + '-' + process.arch")
          # npm takes a few minutes to make new versions available.
          for _ in $(seq 1 30); do
            npm view "sortdo@$version" version > /dev/null 2>&1 && npm view "$platform@$version" version > /dev/null 2>&1 && break
            sleep 20
          done
          npm install -g "sortdo@$version"
          test "$(sortdo --version)" = "sortdo $version"
          if out=$(sortdo update 2>&1); then echo "update did not name npm"; exit 1; fi
          echo "$out" | grep -q "npm install -g sortdo@latest"
          sortdo uninstall --yes | grep -q "npm uninstall -g sortdo"
          npm uninstall -g sortdo
      - name: Homebrew
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install sortdo/tap/sortdo
          test "$(sortdo --version)" = "sortdo ${GITHUB_REF_NAME#v}"
          if out=$(sortdo update 2>&1); then echo "update did not name Homebrew"; exit 1; fi
          echo "$out" | grep -q "brew upgrade sortdo"
          brew uninstall sortdo
