# Builds a pushed vX.Y.Z tag and publishes it to GitHub Releases, Homebrew, winget and npm.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The newest Go release, so every build has the latest security fixes in Go's own packages.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Release notes from CHANGELOG.md
        run: go run ./tools/changelog notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Build and publish (GitHub Releases, Homebrew, winget)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew and winget commits are authored by the person who pushed the tag.
          RELEASE_AUTHOR_NAME: ${{ vars.RELEASE_AUTHOR_NAME || github.actor }}
          RELEASE_AUTHOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          # The minisign release key that signs checksums.txt (tools/sign). sortdo update refuses an unsigned release.
          SORTDO_SIGNING_KEY: ${{ secrets.SORTDO_SIGNING_KEY }}
          SORTDO_SIGNING_PASSWORD: ${{ secrets.SORTDO_SIGNING_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          # Optional until Apple enrollment: with these, the macOS programs are signed and notarized.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Attest where the downloads were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.minisig
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      # npm trusted publishing (OIDC, no token) needs npm 11.5.1 or later; it adds provenance on its own.
      - run: npm install -g npm@latest
      - name: Publish to npm
        run: |
          node npm/build.mjs dist "${GITHUB_REF_NAME#v}" npm-out
          # A leading ./ makes npm read a folder; "npm-out/sortdo" alone is read as a GitHub repository.
          for folder in ./npm-out/cli-*; do npm publish "$folder"; done
          npm publish ./npm-out/sortdo
